<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00131d" />
  <title>Te amo Fati 💖</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #18d9e6;
      --cyan-deep: #087f98;
      --green: #1f7a49;
      --green-dark: #073a2b;
      --gold: #ffc928;
      --orange: #ff7a00;
    }
    html, body { width: 100%; height: 100%; }
    body {
      min-height: 100svh;
      overflow: hidden;
      color: #fff;
      background: radial-gradient(circle at 50% 35%, rgba(0, 166, 205, .24), transparent 38%),
                  linear-gradient(to top, #00a8d2 0%, #005b78 31%, #00131d 76%, #00080d 100%);
      font-family: "Poppins", sans-serif;
    }
    body::after {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 20;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 4, 8, .48) 115%);
    }

    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #fallingCanvas { z-index: 1; pointer-events: none; }
    #meadowCanvas { z-index: 2; }
    #loveCanvas { z-index: 12; pointer-events: none; }

    .horizon {
      position: fixed; left: -8%; right: -8%; bottom: -3vh; height: 34vh; z-index: 0;
      border-radius: 50% 50% 0 0 / 22% 22% 0 0;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(40, 181, 126, .28), transparent 35%),
        radial-gradient(ellipse at 82% 16%, rgba(18, 148, 105, .25), transparent 34%),
        linear-gradient(to bottom, rgba(8, 85, 70, .76), #032e2b 68%, #011c20);
      box-shadow: 0 -22px 80px rgba(17, 216, 186, .08);
    }
    .horizon::before {
      content: ""; position: absolute; inset: 18% 0 auto; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(112,255,225,.28), transparent);
    }

    .bouquet {
      position: fixed; z-index: 6; left: 50%; bottom: clamp(54px, 8vh, 84px);
      width: 570px; height: 630px;
      transform: translateX(-50%) scale(var(--bouquet-scale, .6)); transform-origin: bottom center;
      pointer-events: none;
    }
    .stem {
      position: absolute; z-index: 1; left: 50%; bottom: 15px; width: 11px; height: var(--h);
      border-radius: 100% 20% 30% 80%; transform-origin: bottom;
      transform: translateX(-50%) rotate(var(--r));
      background: linear-gradient(90deg, #073b2d, #34a65f 48%, #0b5c3d 70%, #042f28);
      box-shadow: inset 1px 0 rgba(131,255,166,.2);
    }
    .leaf {
      position: absolute; z-index: 2; left: 50%; bottom: var(--b); width: 64px; height: 108px;
      border-radius: 100% 12% 100% 12%; transform-origin: 0 100%;
      transform: translateX(var(--x)) rotate(var(--r));
      background: radial-gradient(circle at 35% 35%, #56ba6d, #0b5a39 62%, #053326);
      box-shadow: inset 8px 5px 15px rgba(103,255,138,.08);
    }
    .leaf::after { content:""; position:absolute; left:48%; top:14%; width:1px; height:76%; background:rgba(173,255,182,.22); transform:rotate(27deg); }

    .flower {
      position: absolute; z-index: 4; left: var(--x); top: var(--y); width: 160px; height: 160px;
      transform: translate(-50%, -50%) scale(var(--s)) rotate(var(--tilt));
      animation: bloom 1.25s cubic-bezier(.2,.8,.2,1) both, float 5.5s calc(var(--delay) + 1.25s) ease-in-out infinite;
      animation-delay: var(--delay), calc(var(--delay) + 1.25s);
    }
    .petal {
      position: absolute; left: 50%; top: 50%; width: 42px; height: 91px;
      border-radius: 55% 55% 38% 38% / 70% 70% 35% 35%; transform-origin: 50% 88%;
      transform: translate(-50%, -88%) rotate(calc(var(--i) * 30deg));
      background: radial-gradient(ellipse at 35% 30%, #fff278 0%, var(--gold) 28%, #ff9c0a 72%, #e66700 100%);
      box-shadow: inset -4px -8px 10px rgba(174,70,0,.23), 0 3px 5px rgba(0,0,0,.17);
    }
    .petal:nth-child(even) { width: 38px; height: 86px; filter: brightness(.93); }
    .center {
      position: absolute; z-index: 3; left: 50%; top: 50%; width: 82px; height: 82px;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle at 42% 38%, #7c491e 0 10%, #45200c 34%, #170b07 68%, #ff7500 71%, #5c2508 77%);
      border: 3px solid rgba(255,150,10,.5);
      box-shadow: inset 0 0 13px #050302, 0 2px 11px rgba(0,0,0,.38);
    }
    .center::after {
      content:""; position:absolute; inset:8px; border-radius:50%; opacity:.5;
      background-image: radial-gradient(circle, #d58b27 0 1px, transparent 1.6px); background-size: 7px 7px;
    }

    .tie {
      position: absolute; z-index: 8; left: 50%; bottom: 100px; width: 96px; height: 43px;
      transform: translateX(-50%) rotate(-2deg); border-radius: 10px;
      background: linear-gradient(135deg, #79fbff, #12c9dc 48%, #08798e);
      box-shadow: 0 8px 14px rgba(0,0,0,.26), inset 0 2px rgba(255,255,255,.35);
    }
    .tie::before, .tie::after {
      content:""; position:absolute; top:15px; width:80px; height:72px; z-index:-1;
      background: linear-gradient(150deg, #18dae5, #067b99); clip-path: polygon(0 0,100% 20%,67% 100%,45% 67%,0 94%);
    }
    .tie::before { right:72px; transform:rotate(15deg) scaleX(-1); }
    .tie::after { left:72px; transform:rotate(-15deg); }
    .knot {
      position:absolute; left:50%; top:50%; width:42px; height:50px; transform:translate(-50%,-50%);
      border-radius:50%; background:linear-gradient(135deg,#8bffff,#16cbde 50%,#06748d); box-shadow:0 4px 8px rgba(0,0,0,.28);
    }

    .flower-btn {
      position: fixed; z-index: 15; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      min-width: 188px; padding: 13px 24px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      color: white; background: linear-gradient(115deg, rgba(255,187,0,.94), rgba(255,94,0,.94));
      box-shadow: 0 10px 28px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.35);
      font: 600 13px "Poppins", sans-serif; letter-spacing: .16em; text-transform: uppercase;
      cursor: pointer; transition: transform .25s, box-shadow .25s, filter .25s;
    }
    .flower-btn:hover { transform: translateX(-50%) translateY(-4px); box-shadow: 0 14px 34px rgba(0,0,0,.42), 0 0 24px rgba(255,197,29,.26); filter: brightness(1.08); }
    .flower-btn:focus-visible { outline: 3px solid #7df8ff; outline-offset: 4px; }
    .flower-btn.playing { background: linear-gradient(115deg, rgba(8,151,171,.95), rgba(28,218,227,.95)); }

    @keyframes bloom { from { opacity:0; transform:translate(-50%,-40%) scale(.1) rotate(var(--tilt));  } }
    @keyframes float { 50% { translate: 0 -5px; rotate: 1deg; } }

    @media (max-height: 720px), (max-width: 560px) {
      .bouquet { bottom: 68px; }
      .flower-btn { bottom: max(14px, env(safe-area-inset-bottom)); padding: 11px 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .flower { animation: none; } }
    body.paused .flower { animation-play-state: paused; }
  </style>
</head>
<body>
  <audio id="id_audio" preload="metadata" src="Golden Hour - JVKE _ String Orchestra Cover by Vivid Strings.mp3"></audio>
  <div class="horizon" aria-hidden="true"></div>
  <canvas id="fallingCanvas" aria-hidden="true"></canvas>
  <canvas id="meadowCanvas" aria-hidden="true"></canvas>
  <canvas id="loveCanvas" aria-hidden="true"></canvas>

  <main class="bouquet" id="bouquet" aria-label="Ramo de cinco girasoles">
    <div class="stem" style="--h:430px;--r:-15deg"></div><div class="stem" style="--h:470px;--r:-7deg"></div>
    <div class="stem" style="--h:500px;--r:0deg"></div><div class="stem" style="--h:465px;--r:8deg"></div><div class="stem" style="--h:425px;--r:15deg"></div>
    <div class="leaf" style="--b:175px;--x:-25px;--r:-68deg"></div><div class="leaf" style="--b:225px;--x:4px;--r:48deg"></div>
    <div class="leaf" style="--b:300px;--x:-14px;--r:-55deg"></div><div class="leaf" style="--b:335px;--x:0px;--r:52deg"></div>
    <div class="tie"><span class="knot"></span></div>
  </main>

  <button class="flower-btn" id="flowerBtn" type="button" aria-label="Reproducir música y mostrar mensaje">Haz clic aquí</button>

  <script>
    const bouquet = document.getElementById('bouquet');
    const flowerData = [
      {x:'25%',y:'31%',s:.88,t:'-13deg',d:'.35s'}, {x:'39%',y:'19%',s:.96,t:'-7deg',d:'.12s'},
      {x:'51%',y:'31%',s:1.08,t:'2deg',d:'.25s'}, {x:'64%',y:'18%',s:.96,t:'8deg',d:'.05s'},
      {x:'77%',y:'32%',s:.88,t:'14deg',d:'.42s'}
    ];
    flowerData.forEach((f) => {
      const el = document.createElement('div'); el.className = 'flower';
      el.style.cssText = `--x:${f.x};--y:${f.y};--s:${f.s};--tilt:${f.t};--delay:${f.d}`;
      for(let i=0;i<12;i++){ const p=document.createElement('i'); p.className='petal'; p.style.setProperty('--i',i); el.appendChild(p); }
      const c=document.createElement('span'); c.className='center'; el.appendChild(c); bouquet.appendChild(el);
    });


    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const fallC = document.getElementById('fallingCanvas');
    const fallX = fallC.getContext('2d');
    const meadowC = document.getElementById('meadowCanvas');
    const meadowX = meadowC.getContext('2d');
    const loveC = document.getElementById('loveCanvas');
    const loveX = loveC.getContext('2d');
    const btn = document.getElementById('flowerBtn');
    const audio = document.getElementById('id_audio');
    let width = 0, height = 0, sparks = [], meadow = [], wisps = [], letters = [];
    let frame = 0, previousTime = 0, loveElapsed = -1, loveDirty = false;
    let resizeTimer, lastBurst = 0, pointer = null;
    let textBand = 120, meadowTop = 0, pixelRatio = 1, waveTime = 0;
    const meadowCache = document.createElement('canvas');
    const meadowCacheX = meadowCache.getContext('2d');
    const waveStripWidth = 20;
    function waveOffset(x) {
      if (reducedMotion.matches) return 0;
      const stripX = Math.floor(x / waveStripWidth) * waveStripWidth;
      return Math.sin(stripX * .007 - waveTime * .5) * 5
        + Math.sin(stripX * .003 + waveTime * .28) * 2;
    }
    function drawMeadow() {
      meadowX.clearRect(0, meadowTop - 9, width, height - meadowTop + 9);
      // Move cached strips instead of recalculating every point and glow.
      for (let x = 0; x < width; x += waveStripWidth) {
        const stripWidth = Math.min(waveStripWidth, width - x);
        meadowX.drawImage(meadowCache,
          x * pixelRatio, 0, stripWidth * pixelRatio, meadowCache.height,
          x, meadowTop + waveOffset(x), stripWidth, meadowCache.height / pixelRatio);
      }
    }

    // Rasterize the glow once; no per-particle shadowBlur in animation frames.
    function makeGlow(color) {
      const sprite = document.createElement('canvas');
      sprite.width = sprite.height = 48;
      const ctx = sprite.getContext('2d');
      const gradient = ctx.createRadialGradient(24, 24, 0, 24, 24, 24);
      gradient.addColorStop(0, '#fffde0');
      gradient.addColorStop(.12, color);
      gradient.addColorStop(.32, color + '80');
      gradient.addColorStop(1, color + '00');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 48, 48);
      return sprite;
    }
    const goldGlow = makeGlow('#ffe43b'), whiteGlow = makeGlow('#ffffff');
    function glow(ctx, sprite, x, y, size, alpha = 1) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
    }
    function fit(canvas, ctx, dpr) {
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function ridge(x) {
      return height * .72 + Math.sin(x * .012) * 18 + Math.sin(x * .027 + 1.4) * 8;
    }
    function layoutBouquet() {
      textBand = Math.max(80, Math.min(150, height * .2));
      const bottom = height - btn.getBoundingClientRect().top + 12;
      const scale = Math.max(.1, Math.min(1, (width - 24) / 570,
        (height - bottom - textBand - 16) / 630));
      bouquet.style.bottom = bottom + 'px';
      bouquet.style.setProperty('--bouquet-scale', scale);
      // Each tip ends 12px below its flower center, safely inside the dark disk.
      bouquet.querySelectorAll('.stem').forEach((stem, i) => {
        const dx = parseFloat(flowerData[i].x) * 5.7 - 285;
        const dy = 615 - (parseFloat(flowerData[i].y) * 6.3 + 12);
        stem.style.setProperty('--h', Math.hypot(dx, dy) + 'px');
        stem.style.setProperty('--r', Math.atan2(dx, dy) * 180 / Math.PI + 'deg');
      });
    }
    function resize() {
      width = innerWidth; height = innerHeight;
      // Limit backing-buffer cost on high-density mobile displays.
      const dpr = Math.min(devicePixelRatio || 1, width < 600 ? 1.25 : 1.5);
      pixelRatio = dpr;
      fit(fallC, fallX, dpr); fit(meadowC, meadowX, dpr); fit(loveC, loveX, dpr);
      layoutBouquet();
      const count = Math.round(Math.min(190, Math.max(85, width * height / 6500)));
      sparks = Array.from({length: count}, () => ({
        x: Math.random() * width, y: Math.random() * height,
        size: 8 + Math.random() * 15, speed: 22 + Math.random() * 42,
        phase: Math.random() * Math.PI * 2, alpha: .45 + Math.random() * .5
      }));
      meadow = []; wisps = [];
      const gap = Math.max(13, Math.sqrt(width * height * .3 / 1600));
      for (let x = 0; x < width; x += gap) {
        for (let y = ridge(x); y < height; y += gap) {
          const p = {x: x + (Math.random() - .5) * 4, y,
            size: 5 + Math.random() * 5};
          meadow.push(p);
          glow(meadowX, whiteGlow, p.x, p.y, p.size, .45 + Math.random() * .4);
        }
      }
      meadowX.globalAlpha = 1;
      meadowTop = Math.floor(height * .72 - 40);
      meadowCache.width = meadowC.width;
      meadowCache.height = Math.ceil((height - meadowTop) * dpr);
      meadowCacheX.clearRect(0, 0, meadowCache.width, meadowCache.height);
      meadowCacheX.drawImage(meadowC, 0, meadowTop * dpr, meadowC.width,
        meadowC.height - meadowTop * dpr, 0, 0, meadowCache.width, meadowCache.height);
      meadowX.clearRect(0, 0, width, height);
      if (loveElapsed >= 0) createLove();
      drawScene(0, 0);
    }
    function interact(event) {
      pointer = {x: event.clientX, y: event.clientY};
      const now = performance.now();
      if (reducedMotion.matches || pointer.y < ridge(pointer.x) - 16 || now - lastBurst < 45) return;
      lastBurst = now;
      // Emit only from the meadow and cap the pool for touch/pointer event bursts.
      for (let i = 0; i < 5 && wisps.length < 100; i++) {
        wisps.push({x: pointer.x + (Math.random() - .5) * 24,
          y: pointer.y + (Math.random() - .5) * 12,
          vx: (Math.random() - .5) * 36, vy: -20 - Math.random() * 45,
          life: 1, size: 3 + Math.random() * 4});
      }
    }
    meadowC.addEventListener('pointermove', interact, {passive: true});
    meadowC.addEventListener('pointerdown', interact, {passive: true});
    meadowC.addEventListener('pointerleave', () => { pointer = null; });
    meadowC.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer = null; });

    function createLove() {
      const off = document.createElement('canvas'), ctx = off.getContext('2d', {willReadFrequently: true});
      off.width = Math.min(900, width - 24); off.height = 150;
      let size = Math.min(100, width * .16, textBand * .7);
      ctx.font = '600 ' + size + 'px "Cormorant Garamond", serif';
      size *= Math.min(1, (off.width - 12) / ctx.measureText('Te amo Fati').width);
      ctx.font = '600 ' + size + 'px "Cormorant Garamond", serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Te amo Fati', off.width / 2, 75);
      const pixels = ctx.getImageData(0, 0, off.width, off.height).data;
      const left = (width - off.width) / 2;
      const top = textBand / 2 - 75;
      letters = [];
      const step = width < 600 ? 3 : 5;
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          if (pixels[(y * off.width + x) * 4 + 3] > 100) {
            letters.push({sx: Math.random() * width, sy: -Math.random() * height * .5,
              tx: left + x, ty: top + y, delay: Math.random() * .45});
          }
        }
      }
      loveDirty = true;
    }
    function drawLove() {
      if (loveElapsed < 0 || !loveDirty) return;
      loveX.clearRect(0, 0, width, height);
      let moving = false;
      for (const p of letters) {
        const progress = reducedMotion.matches ? 1 : Math.max(0, Math.min(1, (loveElapsed - p.delay) / 2));
        moving ||= progress < 1;
        const eased = 1 - Math.pow(1 - progress, 3);
        glow(loveX, goldGlow, p.sx + (p.tx - p.sx) * eased,
          p.sy + (p.ty - p.sy) * eased, 8, Math.min(1, progress * 4));
      }
      loveX.globalAlpha = 1;
      loveDirty = moving;
    }
    function drawScene(dt, time) {
      waveTime += dt;
      drawMeadow();
      fallX.clearRect(0, 0, width, height);
      for (const p of sparks) {
        if (!reducedMotion.matches) {
          p.y += p.speed * dt; p.x += Math.sin(time * .0006 + p.phase) * 9 * dt;
          if (p.y > height + 15) { p.y = -15; p.x = Math.random() * width; }
        }
        const flicker = reducedMotion.matches ? 1 : .8 + .2 * Math.sin(time * .002 + p.phase);
        glow(fallX, goldGlow, p.x, p.y, p.size, p.alpha * flicker);
      }
      if (pointer && pointer.y >= ridge(pointer.x) - 25) {
        for (const p of meadow) {
          const py = p.y + waveOffset(p.x);
          const dx = p.x - pointer.x, dy = py - pointer.y;
          if (Math.abs(dx) < 65 && Math.abs(dy) < 65 && dx * dx + dy * dy < 4225) {
            glow(fallX, whiteGlow, p.x, py - 3, p.size * 1.8, .8);
          }
        }
      }
      for (let i = wisps.length - 1; i >= 0; i--) {
        const p = wisps[i]; p.life -= dt * .55;
        if (p.life <= 0) { wisps[i] = wisps[wisps.length - 1]; wisps.pop(); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        glow(fallX, whiteGlow, p.x, p.y, p.size, p.life);
      }
      fallX.globalAlpha = 1;
    }
    function animate(time) {
      frame = requestAnimationFrame(animate);
      // One scheduler, maximum 60 updates per second even on 120/144Hz screens.
      if (previousTime && time - previousTime < 1000 / 60 - .5) return;
      const dt = previousTime ? Math.min((time - previousTime) / 1000, .05) : 0;
      previousTime = time;
      drawScene(dt, time);
      if (loveElapsed >= 0) {
        loveElapsed += dt; drawLove();
        if (loveElapsed > 11) {
          loveElapsed = -1; letters = []; loveX.clearRect(0, 0, width, height);
        }
      }
    }
    document.addEventListener('visibilitychange', () => {
      document.body.classList.toggle('paused', document.hidden);
      cancelAnimationFrame(frame); previousTime = 0;
      if (!document.hidden) frame = requestAnimationFrame(animate);
    });
    addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 100); });
    btn.addEventListener('click', () => {
      loveElapsed = 0; createLove();
      btn.classList.add('playing'); btn.textContent = 'Para ti, Fati ♡';
      audio.volume = .8;
      audio.play().catch(() => { btn.textContent = 'Toca otra vez para escuchar'; });
    });
    document.fonts.ready.then(() => {
      layoutBouquet();
      if (loveElapsed >= 0) createLove();
    });
    resize();
    frame = requestAnimationFrame(animate);
  </script>
</body>
</html>
